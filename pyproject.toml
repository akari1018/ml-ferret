[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ferret"
version = "1.0.1"
description = "Towards GPT-4 like large language and visual assistant."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # --- Core ML/Data Libraries ---
    "torch",
    "torchvision",
    "numpy",
    "tokenizers>=0.12.1",
    "timm>=0.6.13",
    "scikit-learn>=1.5.0",
    "einops>=0.6.1",
    "einops-exts>=0.0.4",
    "sentencepiece>=0.1.99",
    # --- High-Risk Pinned Dependencies (Updated for CUDA 12.8 compatibility) ---
    "deepspeed==0.9.5",
    "peft==0.4.0",
    "accelerate==0.21.0",
    "bitsandbytes>=0.43.0",  # Updated to support newer CUDA versions
    "transformers @ git+https://github.com/huggingface/transformers.git@cae78c46",
    # --- Web/API and Utility Libraries ---
    "fastapi",
    "uvicorn",
    "requests",
    "httpx>=0.24.0",
    "gradio==3.50.2",
    "shortuuid",
    "markdown2[all]",
    "openai",
    "wandb",
]

[project.urls]
"Homepage" = "https://github.com/apple/ml-ferret"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]